differences_from_reference:
- hostage treaty instead of a marriage; no bed and no romance
- the substitution is a planned death sentence tied to a betrayal of the realm, not a pregnancy scheme
- revealed by a craft (mending), not a mark, scent, oracle or bloodline
- the dragon is a wounded creature she heals, and it becomes her ally in the climax
- the ending is a title earned by her own work; no grandfather, no wedding
proximity_risk: low
