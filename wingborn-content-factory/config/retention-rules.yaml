# Regras usadas por /revisar-retencao e pelas checagens de abertura do bloco 1.
# Baseadas nos princípios do canal, não em fórmula fixa.

target_duration_minutes: [15, 20]

# Velocidade média de narração usada para converter caracteres em tempo.
# 15 caracteres/segundo ≈ 150 palavras/minuto em inglês. Ajuste para a sua voz real.
narration_chars_per_second: 15

# Abertura do bloco 1 (em segundos de narração).
opening:
  antagonist_identified_by_seconds: 30
  symbol_planted_by_seconds: 60
  fantasy_signal_by_seconds: 60

timeline_template:
  - segment: "00:00-00:30"
    purpose: "injustiça e promessa"
  - segment: "00:30-01:00"
    purpose: "objeto, marca ou segredo plantado"
  - segment: "01:00-03:00"
    purpose: "consequência e primeira pergunta"
  - segment: "03:00-06:00"
    purpose: "primeira recompensa ou demonstração de poder"
  - segment: "06:00-09:00"
    purpose: "humilhação, descoberta ou risco"
  - segment: "09:00-12:00"
    purpose: "revelação intermediária e aproximação do dragão"
  - segment: "12:00-16:00"
    purpose: "confronto e clímax"
  - segment: "16:00-20:00"
    purpose: "reparação e encerramento, ajustado à duração real"

minimum_microclimaxes_before_final: 2
max_pure_explanation_minutes: 2
