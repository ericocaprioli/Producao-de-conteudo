# Regras usadas por /criar-titulos e validate_title_promise.py.
# As listas de palavras são heurísticas de apoio, não uma prova de qualidade do título.

max_length_chars: 100
count_range: [3, 5]

angles:
  - family_injustice
  - vulnerability
  - dragon
  - secret_or_heritage
  - revenge_or_reparation

required_signals:
  - who_suffered
  - who_caused_harm
  - what_event_happened
  - what_reversal_is_delivered

# severity: fail  -> reprova o título
# severity: review -> exige revisão humana (a regra depende de contexto que um regex não enxerga)
forbidden_patterns:
  - pattern: '\bthey\b'
    severity: review
    reason: "'they' só é aceitável se o antecedente for claro no próprio título (ex.: família, dragões)"

# Papéis familiares citados no título precisam existir na direção selecionada
# (evita título que fala da mãe quando a traidora real é outra pessoa).
family_roles: [mother, father, stepmother, stepfather, sister, brother, stepsister, stepbrother, husband, wife,
               aunt, uncle, grandmother, grandfather, daughter, son]
generic_family_terms: [family, parents, kin]

# Marcadores de virada que criam lacuna de curiosidade.
turn_markers: ["—", "–", " - ", "but", "until", "then", "without knowing", "not knowing", "never knew", "only to"]

keyword_groups:
  injustice:
    - betrayed
    - abandoned
    - humiliated
    - sold
    - cast
    - disowned
    - exiled
    - rejected
    - shamed
    - mocked
    - offered
    - sacrificed
    - left
    - handed
    - walked
    - traded
  fantastical:
    - dragon
    - dragons
    - fire
    - flame
    - curse
    - cursed
    - magic
    - throne
    - kingdom
    - blood
    - scales
    - ancient
    - nest
    - shrine
  reversal:
    - until
    - but
    - then
    - now
    - revenge
    - returned
    - truth
    - secret
    - rise
    - vindication
    - reclaim
    - chose
    - bowed
    - answered
  identifiable_subject:
    - she
    - her
    - daughter
    - girl
    - princess
    - servant
    - bride
    - sister
    - widow
