# Cópia fiel da direção A de 03_original_directions/directions.yaml (sem reescrita).
id: A
proximity_level: high
logline: On the night of the first frost, a toll-keeper's widow walks her nine-year-old daughter into the valley
  where dragons hunt and leaves her there, so her new husband can seize the ford charter — but the grey dragon that
  finds the child lowers its head to the whorl her mother always hid.
title_draft: Her Mother Walked Her Into the Dragons' Valley and Never Came Back — Until the Grey Dragon Bowed
thumbnail_concept: A thin girl stands barefoot on a frost-covered stone bridge at blue dawn, holding a small brass
  lantern up at arm's length; an ash-grey dragon lies coiled on the riverbank below, head lowered toward her; a
  woman's long shadow crosses the bridge from the top edge. Cold blue palette with one warm lantern glow.
characters:
- name: Ailis
  role: daughter, nine years old
- name: Maren
  role: mother, keeper of the toll-house
- name: Osric
  role: stepfather and tax-reeve
- name: Tamsin
  role: exiled lantern-keeper, marginalized mentor
- name: the grey one
  role: dragon bonded to the ford-wardens
